name: Priorizar dominio oficial en Google

on:
  push:
    paths:
      - '.github/workflows/reforzar-dominio-google.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reforzar-dominio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reforzar dominio canonico y redireccion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          DOMAIN='https://parquetaranibar.live'
          GH_HOST='shamimsm8524-ship-it.github.io'
          PROJECT_PREFIX='/pagina-web-pisos./'

          redirect = '''<script id="parquetOfficialDomainRedirect">
          (function(){
            if(location.hostname!=='shamimsm8524-ship-it.github.io') return;
            var p=location.pathname||'/';
            if(p.indexOf('/pagina-web-pisos./')===0) p=p.slice('/pagina-web-pisos.'.length)||'/';
            location.replace('https://parquetaranibar.live'+p+location.search+location.hash);
          })();
          </script>'''

          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            rel='/' if p.name=='index.html' else '/'+p.name
            canonical=DOMAIN+rel

            # Canonical siempre apunta al dominio oficial.
            s=re.sub(r'<link\s+rel="canonical"\s+href="[^"]*"\s*/?>',
                     f'<link rel="canonical" href="{canonical}">',s,count=1)
            if 'rel="canonical"' not in s:
              s=s.replace('</head>',f'<link rel="canonical" href="{canonical}">\n</head>',1)

            # URL social oficial.
            s=re.sub(r'<meta\s+property="og:url"\s+content="[^"]*"\s*/?>',
                     f'<meta property="og:url" content="{canonical}">',s,count=1)

            # Si alguien entra por github.io, lo enviamos al dominio comercial.
            s=re.sub(r'<script id="parquetOfficialDomainRedirect">[\s\S]*?</script>',redirect,s,count=1)
            if 'id="parquetOfficialDomainRedirect"' not in s:
              s=s.replace('</head>',redirect+'\n</head>',1)

            p.write_text(s,encoding='utf-8')

          # 404: cualquier URL antigua de GitHub Pages termina en el dominio oficial.
          notfound='''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Parquet Aranibar</title><script>(function(){var p=location.pathname||'/';if(p.indexOf('/pagina-web-pisos./')===0)p=p.slice('/pagina-web-pisos.'.length)||'/';location.replace('https://parquetaranibar.live'+p+location.search+location.hash)})();</script></head><body></body></html>'''
          Path('404.html').write_text(notfound,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 404.html
          git commit -m "Reforzar parquetaranibar.live como dominio oficial"
          git pull --rebase origin main
          git push
