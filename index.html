<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Parquet Aranibar | Pisos y Acabados
</title>

<meta name="description"
content="Venta, instalación, pulido y restauración de parquet, parquetón, pisos SPC, pisos laminados y acabados en madera.">

<style>

:root{

--azul:#123c4b;
--azul-profundo:#092b37;

--madera:#bb7544;
--madera-clara:#dfa06a;

--blanco:#ffffff;
--marfil:#f8f5ef;
--crema:#f0ebe3;

--texto:#252525;
--gris:#6c6c6c;

--linea:#e5ded4;

--verde:#25d366;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:Arial,Helvetica,sans-serif;
background:white;
color:var(--texto);
line-height:1.6;

}

img{

display:block;
width:100%;

}

a{

color:inherit;
text-decoration:none;

}

button,
input,
textarea,
select{

font:inherit;

}

button{

cursor:pointer;

}

.contenedor{

width:min(1180px,92%);
margin:auto;

}


/* =========================
HEADER
========================= */

header{

position:sticky;
top:0;

z-index:1000;

background:rgba(255,255,255,.97);

border-bottom:1px solid var(--linea);

box-shadow:
0 3px 20px rgba(0,0,0,.04);

}

.header-inner{

min-height:92px;

display:flex;

align-items:center;

justify-content:space-between;

gap:25px;

}

.marca{

display:flex;
align-items:center;
gap:14px;

}

.logo-header{

width:90px;
height:72px;

object-fit:contain;

}

.marca-texto strong{

display:block;

font-family:Georgia,serif;

font-size:20px;

color:var(--azul);

letter-spacing:.6px;

}

.marca-texto small{

display:block;

color:var(--madera);

font-size:9px;

letter-spacing:2.2px;

margin-top:3px;

}

.menu{

display:flex;

gap:27px;

align-items:center;

}

.menu a{

font-size:13px;

font-weight:bold;

color:#333;

transition:.25s;

}

.menu a:hover{

color:var(--madera);

}

.btn-header{

background:var(--azul);

color:white;

font-size:12px;

font-weight:bold;

padding:12px 19px;

border-radius:4px;

transition:.25s;

}

.btn-header:hover{

background:var(--madera);

}


/* =========================
HERO
========================= */

.hero{

min-height:720px;

display:flex;

align-items:center;

background:

linear-gradient(
90deg,
rgba(255,255,255,.97) 0%,
rgba(255,255,255,.90) 34%,
rgba(255,255,255,.42) 58%,
rgba(255,255,255,.05) 78%
),

url("./img/parquet-sala.jpg.jpeg")
center/cover no-repeat;

}

.hero-contenido{

max-width:720px;

padding:90px 0;

}

.mini{

color:var(--madera);

font-weight:bold;

font-size:10px;

letter-spacing:3px;

margin-bottom:16px;

}

.hero h1{

font-family:Georgia,serif;

font-size:clamp(51px,7vw,84px);

font-weight:normal;

line-height:1.02;

color:var(--azul-profundo);

margin-bottom:25px;

}

.hero h1 span{

display:block;

color:var(--madera);

font-style:italic;

}

.hero p{

max-width:600px;

color:#4f4f4f;

font-size:16px;

line-height:1.9;

margin-bottom:34px;

}

.botones{

display:flex;

gap:14px;

flex-wrap:wrap;

}

.btn{

min-height:52px;

padding:0 25px;

display:inline-flex;

align-items:center;

justify-content:center;

border-radius:3px;

font-size:12px;

font-weight:bold;

transition:.25s;

}

.btn-madera{

background:var(--madera);

color:white;

}

.btn-madera:hover{

background:#a45f34;

}

.btn-borde{

border:1px solid var(--azul);

color:var(--azul);

background:white;

}

.btn-borde:hover{

background:var(--azul);
color:white;

}


/* =========================
INTRO
========================= */

.intro{

padding:105px 0;

background:white;

}

.intro-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:90px;

align-items:center;

}

.titulo{

font-family:Georgia,serif;

font-weight:normal;

font-size:clamp(38px,5vw,58px);

line-height:1.08;

color:var(--azul-profundo);

}

.intro-texto strong{

display:block;

font-family:Georgia,serif;

font-size:25px;

font-weight:normal;

line-height:1.45;

margin-bottom:18px;

}

.intro-texto p{

color:var(--gris);

line-height:1.9;

}


/* =========================
PRODUCTOS
========================= */

.productos{

padding:105px 0;

background:var(--marfil);

}

.productos-cabecera{

display:flex;

justify-content:space-between;

gap:50px;

align-items:end;

margin-bottom:45px;

}

.productos-cabecera > p{

max-width:380px;

color:var(--gris);

line-height:1.8;

}

.productos-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:20px;

}

.producto{

background:white;

border:1px solid var(--linea);

box-shadow:
0 10px 30px rgba(0,0,0,.05);

overflow:hidden;

transition:.3s;

}

.producto:hover{

transform:translateY(-5px);

box-shadow:
0 14px 38px rgba(0,0,0,.09);

}

.producto img{

height:340px;

object-fit:cover;

}

.producto-info{

padding:28px;

}

.producto-info span{

color:var(--madera);

font-size:9px;

letter-spacing:2px;

font-weight:bold;

}

.producto-info h3{

font-family:Georgia,serif;

font-size:29px;

font-weight:normal;

color:var(--azul);

margin:8px 0 12px;

}

.producto-info p{

color:var(--gris);

font-size:13px;

line-height:1.8;

margin-bottom:19px;

}

.producto-info a{

color:var(--azul);

font-size:11px;

font-weight:bold;

border-bottom:
1px solid var(--madera);

padding-bottom:4px;

}


/* =========================
INSTALACIÓN
========================= */

.instalacion{

padding:110px 0;

background:white;

}

.instalacion-grid{

display:grid;

grid-template-columns:
1.08fr .92fr;

gap:75px;

align-items:center;

}

.instalacion-foto{

position:relative;

}

.instalacion-foto img{

height:610px;

object-fit:cover;

}

.instalacion-foto::after{

content:"";

position:absolute;

left:20px;

bottom:-20px;

width:90%;

height:90%;

z-index:-1;

background:var(--crema);

}

.instalacion-texto > p{

color:var(--gris);

line-height:1.9;

margin:24px 0;

}

.lista{

border-top:
1px solid var(--linea);

}

.lista div{

padding:15px 0;

border-bottom:
1px solid var(--linea);

}

.lista div::before{

content:"✓";

color:var(--madera);

font-weight:bold;

margin-right:12px;

}


/* =========================
SERVICIOS
========================= */

.servicios{

padding:105px 0;

background:#f5f1ea;

}

.servicios-intro{

max-width:720px;

margin-bottom:42px;

}

.servicios-intro p{

color:var(--gris);

margin-top:18px;

line-height:1.8;

}

.servicios-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.servicio{

background:white;

border:1px solid var(--linea);

overflow:hidden;

box-shadow:
0 7px 25px rgba(0,0,0,.04);

}

.servicio-boton{

width:100%;

border:none;

background:white;

text-align:left;

padding:27px;

transition:.25s;

}

.servicio-boton:hover{

background:#fcfaf7;

}

.servicio-superior{

display:flex;

align-items:center;

justify-content:space-between;

}

.numero{

width:48px;
height:48px;

border-radius:50%;

background:var(--azul);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-family:Georgia,serif;

font-size:18px;

}

.flecha{

font-size:21px;

color:var(--madera);

transition:.3s;

}

.servicio.activo .flecha{

transform:rotate(180deg);

}

.servicio h3{

font-family:Georgia,serif;

color:var(--azul);

font-size:24px;

font-weight:normal;

margin:22px 0 7px;

}

.servicio-boton p{

color:var(--gris);

font-size:13px;

}

.servicio-imagen{

max-height:0;

overflow:hidden;

opacity:0;

transition:
max-height .45s ease,
opacity .35s ease;

}

.servicio.activo .servicio-imagen{

max-height:500px;

opacity:1;

}

.servicio-imagen img{

height:280px;

object-fit:cover;

}

.servicio-imagen div{

padding:18px 24px 24px;

background:#fff;

color:var(--gris);

font-size:13px;

line-height:1.75;

}


/* =========================
ZÓCALOS
========================= */

.zocalos{

padding:105px 0;

background:white;

}

.zocalos-grid{

display:grid;

grid-template-columns:
.9fr 1.1fr;

gap:70px;

align-items:center;

}

.zocalos-texto p{

color:var(--gris);

margin-top:22px;

line-height:1.9;

}

.zocalos img{

height:510px;

object-fit:cover;

}


/* =========================
GALERÍA
========================= */

.galeria{

padding:105px 0;

background:var(--marfil);

}

.galeria-grid{

margin-top:45px;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.galeria-item{

background:white;

border:1px solid var(--linea);

overflow:hidden;

}

.galeria-item img{

height:330px;

object-fit:cover;

transition:.4s;

}

.galeria-item:hover img{

transform:scale(1.03);

}

.galeria-nombre{

padding:18px 20px;

font-family:Georgia,serif;

font-size:20px;

color:var(--azul);

}


/* =========================
FORMULARIO
========================= */

.cotizacion{

padding:110px 0;

background:white;

}

.cotizacion-grid{

display:grid;

grid-template-columns:
.85fr 1.15fr;

gap:80px;

align-items:start;

}

.cotizacion-info{

position:sticky;

top:125px;

}

.cotizacion-info p{

color:var(--gris);

line-height:1.9;

margin-top:22px;

}

.dato{

margin-top:30px;

padding-top:25px;

border-top:
1px solid var(--linea);

}

.dato strong{

display:block;

font-size:10px;

letter-spacing:2px;

color:var(--madera);

margin-bottom:8px;

}

.dato a{

font-family:Georgia,serif;

font-size:25px;

color:var(--azul);

}

.formulario{

background:var(--marfil);

padding:38px;

border:
1px solid var(--linea);

box-shadow:
0 12px 35px rgba(0,0,0,.05);

}

.formulario h3{

font-family:Georgia,serif;

font-weight:normal;

font-size:30px;

color:var(--azul);

margin-bottom:8px;

}

.formulario > p{

color:var(--gris);

font-size:13px;

margin-bottom:28px;

}

.campos-dobles{

display:grid;

grid-template-columns:
1fr 1fr;

gap:16px;

}

.campo{

margin-bottom:17px;

}

.campo label{

display:block;

font-size:11px;

font-weight:bold;

color:#555;

margin-bottom:7px;

}

.campo input,
.campo select,
.campo textarea{

width:100%;

border:
1px solid #dad2c8;

background:white;

outline:none;

padding:14px;

color:#333;

border-radius:2px;

transition:.25s;

}

.campo input,
.campo select{

height:50px;

}

.campo textarea{

min-height:135px;

resize:vertical;

}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{

border-color:var(--madera);

box-shadow:
0 0 0 3px rgba(187,117,68,.08);

}

.btn-form{

width:100%;

border:none;

background:var(--azul);

color:white;

min-height:55px;

font-weight:bold;

font-size:13px;

border-radius:3px;

transition:.25s;

}

.btn-form:hover{

background:var(--madera);

}

.nota-form{

text-align:center;

font-size:10px;

color:#8a8a8a;

margin-top:12px;

}


/* =========================
CTA
========================= */

.cta{

background:var(--azul);

color:white;

text-align:center;

padding:90px 20px;

}

.cta .mini{

color:#e9b27d;

}

.cta h2{

font-family:Georgia,serif;

font-size:clamp(40px,6vw,65px);

font-weight:normal;

line-height:1.05;

max-width:800px;

margin:0 auto 18px;

}

.cta p{

color:#d5e0e3;

margin-bottom:28px;

}

.btn-claro{

background:white;

color:var(--azul);

}


/* =========================
CONTACTO
========================= */

.contacto{

background:white;

padding:90px 0;

}

.contacto-grid{

display:grid;

grid-template-columns:
1.3fr .8fr .8fr;

gap:65px;

}

.logo-footer{

width:210px;

height:145px;

object-fit:contain;

object-position:left center;

margin-bottom:15px;

}

.contacto h3{

font-family:Georgia,serif;

font-size:30px;

font-weight:normal;

color:var(--azul);

}

.contacto small{

color:var(--gris);

}

.contacto-col strong{

display:block;

font-size:10px;

letter-spacing:2px;

color:var(--madera);

margin-bottom:14px;

}

.contacto-col a{

display:block;

padding:10px 0;

border-bottom:
1px solid var(--linea);

}

.contacto-col p{

color:var(--gris);

margin:6px 0;

}


/* =========================
FOOTER
========================= */

footer{

background:#f2eee7;

border-top:
1px solid var(--linea);

padding:23px 0;

color:#777;

font-size:11px;

}

.footer-inner{

display:flex;

justify-content:space-between;

gap:15px;

}


/* =========================
WHATSAPP
========================= */

.whatsapp{

position:fixed;

right:20px;
bottom:20px;

z-index:2000;

height:59px;

padding:0 20px;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

background:var(--verde);

color:white;

border-radius:40px;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

font-weight:bold;

}

.whatsapp svg{

width:25px;

fill:white;

}


/* =========================
RESPONSIVE
========================= */

@media(max-width:950px){

.menu{

display:none;

}

.productos-grid{

grid-template-columns:1fr;

}

.servicios-grid{

grid-template-columns:
1fr 1fr;

}

.intro-grid,
.instalacion-grid,
.zocalos-grid,
.cotizacion-grid{

grid-template-columns:1fr;

}

.cotizacion-info{

position:static;

}

.galeria-grid{

grid-template-columns:
1fr 1fr;

}

.contacto-grid{

grid-template-columns:1fr;

}

}


@media(max-width:620px){

.contenedor{

width:90%;

}

.header-inner{

min-height:76px;

}

.logo-header{

width:58px;
height:55px;

}

.marca-texto strong{

font-size:13px;

}

.marca-texto small{

display:none;

}

.btn-header{

font-size:10px;

padding:9px 11px;

}

.hero{

min-height:680px;

background:

linear-gradient(
90deg,
rgba(255,255,255,.96),
rgba(255,255,255,.77)
),

url("./img/parquet-sala.jpg.jpeg")
center/cover no-repeat;

}

.hero h1{

font-size:48px;

}

.hero p{

font-size:14px;

}

.botones{

flex-direction:column;

}

.btn{

width:100%;

}
