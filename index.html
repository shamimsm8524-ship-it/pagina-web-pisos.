<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parquet Aranibar | Pisos y Acabados</title>

<meta name="description"
content="Venta, instalación, pulido y restauración de parquet, parquetón, pisos SPC, laminados, zócalos y acabados.">

<style>

/* =========================
GENERAL
========================= */

:root{
  --azul:#123b4a;
  --azul-oscuro:#082b37;
  --madera:#bd7544;
  --madera-clara:#dda06b;
  --blanco:#ffffff;
  --marfil:#f8f5ef;
  --crema:#f0ebe3;
  --texto:#262626;
  --gris:#6f6f6f;
  --linea:#e3ddd5;
  --verde:#25d366;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:var(--texto);
  line-height:1.6;
}

img{
  display:block;
  width:100%;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.contenedor{
  width:min(1180px,92%);
  margin:auto;
}

.mini{
  color:var(--madera);
  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:14px;
}

.titulo{
  font-family:Georgia,serif;
  font-weight:normal;
  color:var(--azul-oscuro);
  font-size:clamp(37px,5vw,57px);
  line-height:1.08;
}


/* =========================
HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--linea);
  box-shadow:0 3px 18px rgba(0,0,0,.04);
}

.header{
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.marca{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo-header{
  width:85px;
  height:70px;
  object-fit:contain;
}

.marca-texto strong{
  display:block;
  font-family:Georgia,serif;
  color:var(--azul);
  font-size:19px;
}

.marca-texto small{
  color:var(--madera);
  font-size:9px;
  letter-spacing:2px;
}

nav{
  display:flex;
  gap:24px;
}

nav a{
  font-size:12px;
  font-weight:bold;
}

nav a:hover{
  color:var(--madera);
}

.btn-header{
  background:var(--azul);
  color:white;
  padding:11px 18px;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
}


/* =========================
HERO
========================= */

.hero{
  min-height:700px;
  display:flex;
  align-items:center;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.98) 0%,
      rgba(255,255,255,.93) 34%,
      rgba(255,255,255,.54) 58%,
      rgba(255,255,255,.08) 82%
    ),
    url("./img/parquet-sala.jpg.jpeg")
    center/cover no-repeat;
}

.hero-contenido{
  max-width:710px;
  padding:80px 0;
}

.hero h1{
  font-family:Georgia,serif;
  font-weight:normal;
  color:var(--azul-oscuro);
  font-size:clamp(49px,7vw,83px);
  line-height:1.02;
  margin-bottom:24px;
}

.hero h1 span{
  display:block;
  color:var(--madera);
  font-style:italic;
}

.hero p{
  color:#4e4e4e;
  max-width:590px;
  font-size:16px;
  line-height:1.9;
  margin-bottom:32px;
}

.botones{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
}

.btn{
  min-height:52px;
  padding:0 24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  border-radius:3px;
}

.btn-madera{
  background:var(--madera);
  color:white;
}

.btn-borde{
  background:white;
  color:var(--azul);
  border:1px solid var(--azul);
}


/* =========================
INTRO
========================= */

.intro{
  padding:100px 0;
}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:center;
}

.intro-texto strong{
  display:block;
  font-family:Georgia,serif;
  font-size:24px;
  font-weight:normal;
  margin-bottom:18px;
}

.intro-texto p{
  color:var(--gris);
  line-height:1.9;
}


/* =========================
PRODUCTOS
========================= */

.productos{
  background:var(--marfil);
  padding:100px 0;
}

.cabecera-seccion{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:50px;
  margin-bottom:42px;
}

.cabecera-seccion > p{
  max-width:380px;
  color:var(--gris);
}

.productos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.producto{
  background:white;
  border:1px solid var(--linea);
  overflow:hidden;
  box-shadow:0 9px 28px rgba(0,0,0,.05);
}

.producto img{
  height:330px;
  object-fit:cover;
}

.producto-info{
  padding:26px;
}

.producto-info span{
  color:var(--madera);
  font-size:9px;
  letter-spacing:2px;
  font-weight:bold;
}

.producto-info h3{
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:normal;
  color:var(--azul);
  margin:8px 0 11px;
}

.producto-info p{
  color:var(--gris);
  font-size:13px;
  margin-bottom:18px;
}

.producto-info a{
  color:var(--azul);
  font-size:11px;
  font-weight:bold;
  border-bottom:1px solid var(--madera);
}


/* =========================
INSTALACION
========================= */

.instalacion{
  padding:105px 0;
}

.instalacion-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:70px;
  align-items:center;
}

.instalacion img{
  height:590px;
  object-fit:cover;
}

.instalacion-texto > p{
  color:var(--gris);
  margin:23px 0;
  line-height:1.9;
}

.lista{
  border-top:1px solid var(--linea);
}

.lista div{
  padding:14px 0;
  border-bottom:1px solid var(--linea);
}

.lista div::before{
  content:"✓";
  color:var(--madera);
  font-weight:bold;
  margin-right:12px;
}


/* =========================
SERVICIOS
========================= */

.servicios{
  background:#f5f1eb;
  padding:100px 0;
}

.servicios-texto{
  max-width:700px;
  margin-bottom:40px;
}

.servicios-texto p{
  color:var(--gris);
  margin-top:18px;
}

.servicios-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.servicio{
  background:white;
  border:1px solid var(--linea);
  overflow:hidden;
}

.servicio-btn{
  width:100%;
  border:0;
  background:white;
  padding:25px;
  text-align:left;
}

.servicio-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.numero{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--azul);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:18px;
}

.flecha{
  color:var(--madera);
  font-size:24px;
  transition:.3s;
}

.servicio.activo .flecha{
  transform:rotate(180deg);
}

.servicio h3{
  color:var(--azul);
  font-family:Georgia,serif;
  font-size:23px;
  font-weight:normal;
  margin:20px 0 7px;
}

.servicio-btn p{
  color:var(--gris);
  font-size:13px;
}

.servicio-contenido{
  display:none;
}

.servicio.activo .servicio-contenido{
  display:block;
}

.servicio-contenido img{
  height:275px;
  object-fit:cover;
}

.servicio-descripcion{
  padding:18px 23px 23px;
  color:var(--gris);
  font-size:13px;
}


/* =========================
ZOCALOS
========================= */

.zocalos{
  padding:105px 0;
}

.zocalos-grid{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:70px;
  align-items:center;
}

.zocalos p{
  color:var(--gris);
  margin-top:20px;
  line-height:1.9;
}

.zocalos img{
  height:500px;
  object-fit:cover;
}


/* =========================
GALERIA
========================= */

.galeria{
  background:var(--marfil);
  padding:100px 0;
}

.galeria-grid{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.galeria-item{
  background:white;
  border:1px solid var(--linea);
}

.galeria-item img{
  height:315px;
  object-fit:cover;
}

.galeria-item h3{
  font-family:Georgia,serif;
  color:var(--azul);
  font-size:20px;
  font-weight:normal;
  padding:18px;
}


/* =========================
FORMULARIO
========================= */

.cotizacion{
  padding:105px 0;
  background:white;
}

.cotizacion-grid{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:75px;
  align-items:start;
}

.cotizacion-info p{
  color:var(--gris);
  line-height:1.9;
  margin-top:20px;
}

.telefono{
  margin-top:28px;
  border-top:1px solid var(--linea);
  padding-top:22px;
}

.telefono strong{
  display:block;
  color:var(--madera);
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:7px;
}

.telefono a{
  font-family:Georgia,serif;
  font-size:27px;
  color:var(--azul);
}

.formulario{
  background:var(--marfil);
  padding:36px;
  border:1px solid var(--linea);
  box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.formulario h3{
  font-family:Georgia,serif;
  color:var(--azul);
  font-size:30px;
  font-weight:normal;
  margin-bottom:8px;
}

.formulario > p{
  color:var(--gris);
  font-size:13px;
  margin-bottom:26px;
}

.doble{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.campo{
  margin-bottom:15px;
}

.campo label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  font-weight:bold;
}

.campo input,
.campo select,
.campo textarea{
  width:100%;
  border:1px solid #d9d1c7;
  background:white;
  padding:13px;
  outline:none;
}

.campo input,
.campo select{
  height:50px;
}

.campo textarea{
  min-height:130px;
  resize:vertical;
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{
  border-color:var(--madera);
}

.enviar{
  width:100%;
  min-height:54px;
  border:0;
  background:var(--azul);
  color:white;
  font-weight:bold;
  font-size:12px;
}

.enviar:hover{
  background:var(--madera);
}


/* =========================
CTA
========================= */

.cta{
  background:var(--azul);
  color:white;
  text-align:center;
  padding:85px 20px;
}

.cta h2{
  font-family:Georgia,serif;
  font-size:clamp(40px,6vw,64px);
  font-weight:normal;
  margin-bottom:15px;
}

.cta p{
  color:#d7e2e5;
  margin-bottom:25px;
}

.btn-blanco{
  background:white;
  color:var(--azul);
}


/* =========================
CONTACTO
========================= */

.contacto{
  padding:85px 0;
  background:white;
}

.contacto-grid{
  display:grid;
  grid-template-columns:1.3fr .8fr .8fr;
  gap:60px;
}

.logo-footer{
  width:210px;
  height:140px;
  object-fit:contain;
  object-position:left center;
}

.contacto h3{
  font-family:Georgia,serif;
  color:var(--azul);
  font-size:29px;
  font-weight:normal;
}

.contacto small{
  color:var(--gris);
}

.contacto-col strong{
  display:block;
  color:var(--madera);
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:13px;
}

.contacto-col a{
  display:block;
  padding:10px 0;
  border-bottom:1px solid var(--linea);
}

.contacto-col p{
  color:var(--gris);
  margin:5px 0;
}


/* =========================
FOOTER
========================= */

footer{
  background:#f1ede7;
  border-top:1px solid var(--linea);
  padding:22px 0;
  color:#777;
  font-size:11px;
}

.footer{
  display:flex;
  justify-content:space-between;
  gap:15px;
}


/* =========================
WHATSAPP
========================= */

.whatsapp{
  position:fixed;
  z-index:5000;
  right:20px;
  bottom:20px;

  height:58px;
  padding:0 19px;

  display:flex;
  align-items:center;
  gap:9px;

  background:var(--verde);
  color:white;
  border-radius:40px;
  font-weight:bold;

  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.whatsapp svg{
  width:25px;
  fill:white;
}


/* =========================
RESPONSIVE
========================= */

@media(max-width:950px){

  nav{
    display:none;
  }

  .productos-grid{
    grid-template-columns:1fr;
  }

  .servicios-grid{
    grid-template-columns:1fr 1fr;
  }

  .intro-grid,
  .instalacion-grid,
  .zocalos-grid,
  .cotizacion-grid{
    grid-template-columns:1fr;
  }

  .galeria-grid{
    grid-template-columns:1fr 1fr;
  }

  .contacto-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:620px){

  .header{
    min-height:74px;
  }

  .logo-header{
    width:58px;
