<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parquet Aranibar | Pisos y Acabados</title>

<meta name="description"
content="Venta, instalación, pulido y restauración de parquet, parquetón, pisos SPC y laminados de alta calidad.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
rel="stylesheet">

<style>

:root{
  --negro:#111413;
  --negro-suave:#1c201e;
  --marfil:#f6f3ed;
  --blanco:#ffffff;
  --madera:#a96f43;
  --madera-clara:#d49a6a;
  --dorado:#c49b62;
  --gris:#736f69;
  --linea:#ddd7ce;
  --verde:#25d366;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"DM Sans",Arial,sans-serif;
  background:var(--marfil);
  color:var(--negro);
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  width:100%;
}

.contenedor{
  width:min(1200px,calc(100% - 48px));
  margin:auto;
}


/* =====================================================
HEADER
===================================================== */

.header{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.18);
  background:linear-gradient(
    180deg,
    rgba(8,10,9,.80),
    rgba(8,10,9,.16)
  );
}

.header-inner{
  min-height:96px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
}

.marca{
  display:flex;
  align-items:center;
  gap:17px;
  color:white;
}

.logo-header{
  width:90px;
  height:76px;
  object-fit:contain;
}

.marca-texto strong{
  display:block;
  font-family:"Playfair Display",serif;
  font-size:20px;
  font-weight:600;
  letter-spacing:.8px;
}

.marca-texto small{
  display:block;
  margin-top:4px;
  font-size:9px;
  letter-spacing:2.6px;
  text-transform:uppercase;
  color:rgba(255,255,255,.68);
}

.menu{
  display:flex;
  align-items:center;
  gap:30px;
}

.menu a{
  position:relative;
  color:rgba(255,255,255,.9);
  font-size:12px;
  font-weight:600;
}

.menu a::after{
  content:"";
  position:absolute;
  bottom:-8px;
  left:0;
  width:0;
  height:1px;
  background:var(--madera-clara);
  transition:.25s;
}

.menu a:hover::after{
  width:100%;
}

.btn-header{
  padding:12px 23px;
  border:1px solid var(--madera-clara);
  color:white;
  font-size:12px;
  font-weight:700;
  transition:.25s;
}

.btn-header:hover{
  background:var(--madera-clara);
  color:var(--negro);
}


/* =====================================================
HERO
===================================================== */

.hero{
  position:relative;
  min-height:850px;
  display:flex;
  align-items:center;
  color:white;

  background:
    linear-gradient(
      90deg,
      rgba(8,10,9,.96) 0%,
      rgba(8,10,9,.83) 37%,
      rgba(8,10,9,.47) 62%,
      rgba(8,10,9,.12) 100%
    ),
    url("img/parquet-sala.jpg.jpeg")
    center / cover no-repeat;
}

.hero-inner{
  max-width:760px;
  padding-top:110px;
  padding-bottom:175px;
}

.etiqueta{
  margin-bottom:22px;
  color:#e3b879;
  font-size:10px;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
}

.hero h1{
  margin-bottom:28px;
  font-family:"Playfair Display",serif;
  font-size:clamp(56px,7vw,94px);
  line-height:.98;
  font-weight:500;
  letter-spacing:-2px;
}

.hero h1 span{
  display:block;
  color:#e4b875;
  font-style:italic;
}

.hero-descripcion{
  max-width:625px;
  margin-bottom:38px;
  color:rgba(255,255,255,.84);
  font-size:17px;
  line-height:1.9;
}

.hero-botones{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.btn{
  min-height:55px;
  padding:0 28px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  transition:.25s;
}

.btn-principal{
  background:#d39a58;
  color:#131313;
}

.btn-principal:hover{
  background:#e6b878;
  transform:translateY(-2px);
}

.btn-secundario{
  border:1px solid rgba(255,255,255,.62);
  color:white;
}

.btn-secundario:hover{
  background:white;
  color:#161616;
}


/* =====================================================
BARRA DE BENEFICIOS
===================================================== */

.hero-info{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);

  width:min(1200px,calc(100% - 48px));

  display:grid;
  grid-template-columns:repeat(3,1fr);

  background:rgba(17,18,16,.92);
  backdrop-filter:blur(13px);

  border-top:1px solid rgba(255,255,255,.17);
}

.hero-info-item{
  min-height:112px;
  padding:25px 30px;
  border-right:1px solid rgba(255,255,255,.11);
}

.hero-info-item:last-child{
  border-right:none;
}

.hero-info-item span{
  color:#dba769;
  font-size:10px;
  letter-spacing:2px;
}

.hero-info-item strong{
  display:block;
  margin:3px 0;
  font-family:"Playfair Display",serif;
  font-size:23px;
  font-weight:500;
}

.hero-info-item small{
  color:rgba(255,255,255,.53);
}


/* =====================================================
TÍTULOS
===================================================== */

.mini{
  margin-bottom:16px;
  color:var(--madera);
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.titulo{
  font-family:"Playfair Display",serif;
  font-size:clamp(40px,5vw,60px);
  line-height:1.08;
  font-weight:500;
}


/* =====================================================
INTRODUCCIÓN
===================================================== */

.intro{
  padding:125px 0;
}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:100px;
  align-items:center;
}

.intro-texto strong{
  display:block;
  margin-bottom:22px;
  font-family:"Playfair Display",serif;
  font-size:25px;
  line-height:1.5;
  font-weight:500;
}

.intro-texto p{
  color:var(--gris);
  font-size:14px;
  line-height:1.9;
}


/* =====================================================
PRODUCTOS
===================================================== */

.productos{
  padding:115px 0;
  background:var(--negro);
  color:white;
}

.productos-cabecera{
  margin-bottom:55px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:60px;
}

.productos-cabecera > p{
  max-width:390px;
  color:rgba(255,255,255,.56);
  font-size:13px;
  line-height:1.8;
}

.grid-productos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.producto{
  position:relative;
  min-height:570px;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:32px;
  background:#333;
}

.producto-imagen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.65s;
}

.producto:hover .producto-imagen{
  transform:scale(1.05);
}

.producto::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.03) 20%,
    rgba(0,0,0,.92) 100%
  );
}

.producto-numero{
  position:absolute;
  top:28px;
  right:28px;
  z-index:2;
  color:rgba(255,255,255,.68);
  font-family:"Playfair Display",serif;
}

.producto-contenido{
  position:relative;
  z-index:2;
}

.producto-categoria{
  color:#e0af70;
  font-size:9px;
  font-weight:700;
  letter-spacing:2.4px;
}

.producto h3{
  margin:8px 0 13px;
  font-family:"Playfair Display",serif;
  font-size:34px;
  font-weight:500;
}

.producto p{
  margin-bottom:23px;
  color:rgba(255,255,255,.72);
  font-size:13px;
  line-height:1.75;
}

.producto-link{
  padding-bottom:5px;
  border-bottom:1px solid rgba(255,255,255,.55);
  font-size:11px;
  font-weight:700;
}


/* =====================================================
INSTALACIÓN
===================================================== */

.instalacion{
  padding:120px 0;
  background:white;
}

.instalacion-grid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:80px;
  align-items:center;
}

.instalacion-foto{
  overflow:hidden;
}

.instalacion-foto img{
  height:650px;
  object-fit:cover;
}

.instalacion-texto > p{
  margin-top:25px;
  margin-bottom:30px;
  color:var(--gris);
  font-size:14px;
  line-height:1.9;
}

.lista{
  border-top:1px solid var(--linea);
}

.lista div{
  padding:17px 0;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid var(--linea);
  font-size:13px;
}

.lista div::before{
  content:"";
  width:24px;
  height:1px;
  background:var(--madera);
}


/* =====================================================
SERVICIOS
===================================================== */

.servicios{
  padding:120px 0;
  background:#eee9e1;
}

.servicios-grid{
  margin-top:55px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--linea);
  border-left:1px solid var(--linea);
}

.servicio{
  min-height:285px;
  padding:32px;
  border-right:1px solid var(--linea);
  border-bottom:1px solid var(--linea);
  transition:.25s;
}

.servicio:hover{
  background:white;
  transform:translateY(-3px);
}

.servicio span{
  color:var(--madera);
  font-family:"Playfair Display",serif;
}

.servicio h3{
  margin:64px 0 13px;
  font-family:"Playfair Display",serif;
  font-size:25px;
  font-weight:500;
}

.servicio p{
  color:var(--gris);
  font-size:13px;
  line-height:1.8;
}


/* =====================================================
ZÓCALOS
===================================================== */

.zocalos{
  padding:110px 0;
  background:white;
}

.zocalos-grid{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:80px;
  align-items:center;
}

.zocalos-texto p:last-child{
  margin-top:24px;
  color:var(--gris);
  line-height:1.9;
}

.zocalos-foto{
  overflow:hidden;
}

.zocalos-foto img{
  height:550px;
  object-fit:cover;
}


/* =====================================================
GALERÍA
===================================================== */

.galeria{
  padding:110px 0;
  background:var(--negro);
  color:white;
}

.galeria-grid{
  margin-top:50px;
  display:grid;
  grid-template-columns:1.4fr .8fr .8fr;
  grid-template-rows:310px 310px;
  gap:14px;
}

.galeria-item{
  position:relative;
  overflow:hidden;
}

.galeria-item:first-child{
  grid-row:1 / 3;
}

.galeria-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.55s;
}

.galeria-item:hover img{
  transform:scale(1.04);
}

.caption{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:55px 22px 20px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.86)
  );
}

.caption strong{
  font-family:"Playfair Display",serif;
  font-size:21px;
  font-weight:500;
}


/* =====================================================
CTA
===================================================== */

.cta{
  padding:100px 24px;
  text-align:center;
  background:#bb8250;
}

.cta .mini{
  color:rgba(0,0,0,.55);
}

.cta h2{
  max-width:900px;
  margin:0 auto 20px;
  font-family:"Playfair Display",serif;
  font-size:clamp(44px,6vw,72px);
  font-weight:500;
  line-height:1.05;
  color:#111;
}

.cta > p:not(.mini){
  margin-bottom:30px;
  color:rgba(0,0,0,.62);
}

.btn-negro{
  background:var(--negro);
  color:white;
}

.btn-negro:hover{
  background:#000;
  transform:translateY(-2px);
}


/* =====================================================
CONTACTO
===================================================== */

.contacto{
  padding:90px 0;
  background:#101311;
  color:white;
}

.contacto-grid{
  display:grid;
  grid-template-columns:1.3fr .8fr .8fr;
  gap:70px;
}

.logo-footer{
  width:180px;
  max-height:130px;
  object-fit:contain;
  object-position:left center;
  margin-bottom:18px;
}

.contacto h3{
  font-family:"Playfair Display",serif;
  font-size:34px;
  font-weight:500;
}

.contacto-marca p{
  margin-top:6px;
  color:rgba(255,255,255,.48);
}

.contacto-col span{
  display:block;
  margin-bottom:18px;
  color:#d99b63;
  font-size:9px;
  font-weight:700;
  letter-spacing:3px;
}

.contacto-col a{
  display:block;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.12);
  font-family:"Playfair Display",serif;
  font-size:20px;
}

.contacto-col p{
  padding:6px 0;
  color:rgba(255,255,255,.53);
  font-size:12px;
}


/* =====================================================
FOOTER
===================================================== */

footer{
  padding:25px 0;
  background:#070807;
  color:rgba(255,255,255,.34);
  font-size:10px;
}

.footer-grid{
  display:flex;
  justify-content:space-between;
  gap:20px;
}


/* =====================================================
WHATSAPP
===================================================== */

.whatsapp{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:9999;

  min-height:58px;
  padding:0 19px;

  display:flex;
  align-items:center;
  gap:10px;

  border-radius:50px;

  background:var(--verde);
  color:white;

  font-size:12px;
  font-weight:700;

  box-shadow:0 14px 38px rgba(0,0,0,.28);

  transition:.25s;
}

.whatsapp:hover{
  transform:translateY(-3px);
}

.whatsapp
